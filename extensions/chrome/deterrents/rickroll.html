<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Accountability Reminder</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 22px;
      }
      section {
        border: 3px solid #38bdf8;
        padding: 24px;
        text-align: center;
        background: #111827;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }
      p {
        margin: 0;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Never gonna give your work time up</h1>
        <p>Close or leave the blocked tab to stop the reminders.</p>
      </section>
    </main>
  </body>
</html>
